# picom configuration
# Minimal default config — customize as needed

# Shadows
shadow = false;

# Fading
fading = false;

# Transparency / Opacity
inactive-opacity = 0.85;
active-opacity = 0.85;
frame-opacity = 1.0;

# Let these apps manage their own opacity (or stay fully opaque)
opacity-rule = [
  "100:class_g = 'brave-browser'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'Steam'",
  "100:class_g = 'steam'",
  "100:class_g = 'steamwebhelper'",
  "100:class_g = 'kitty'"
];

# Background-Blurring
blur-background = false;

# Backend
backend = "glx";

# VSync
vsync = true;
