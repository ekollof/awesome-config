# colors-kitty.conf — wallust template for kitty terminal
#
# Template location: ~/.config/wallust/templates/colors-kitty.conf
# Output location:   ~/.config/kitty/wallust-colors.conf   (set in wallust.toml)
#
# To use, add to the bottom of ~/.config/kitty/kitty.conf:
#
#   include ~/.config/kitty/wallust-colors.conf
#
# This file uses wallust's "new engine" ({{variable}} syntax).
# kitty reloads its config on SIGUSR1: kill -SIGUSR1 $(pgrep kitty)
# Or add a hook in wallust.toml:
#   [hooks]
#   kitty = "kill -SIGUSR1 $(pgrep -x kitty) 2>/dev/null || true"

foreground   {{foreground}}
background   {{background}}
cursor       {{cursor}}

color0       {{color0}}
color8       {{color8}}
color1       {{color1}}
color9       {{color9}}
color2       {{color2}}
color10      {{color10}}
color3       {{color3}}
color11      {{color11}}
color4       {{color4}}
color12      {{color12}}
color5       {{color5}}
color13      {{color13}}
color6       {{color6}}
color14      {{color14}}
color7       {{color7}}
color15      {{color15}}

selection_foreground  {{background}}
selection_background  {{color7}}
