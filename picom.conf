# picom configuration
# Minimal default config — customize as needed

# Shadows
shadow = false;

# Fading
fading = false;

# Transparency / Opacity
inactive-opacity = 0.85;
active-opacity = 0.85;
frame-opacity = 1.0;

# Background-Blurring
blur-background = false;

# Backend
backend = "glx";

# VSync
vsync = true;
