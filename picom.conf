# picom configuration
# Minimal default config — customize as needed

# Shadows
shadow = false;

# Fading
fading = false;

# Transparency / Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Terminals get transparency; they manage their own opacity
opacity-rule = [
  "85:class_g = 'kitty'"
];

# Background-Blurring
blur-background = false;

# Backend
backend = "glx";

# VSync
vsync = true;
